name: RSTREAM Multi-Platform Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (RSTREAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run cap:sync
      - run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias rstream -keyalg RSA -keysize 2048 -validity 10000 -storepass rstream123 -keypass rstream123 -dname "CN=RSTREAM, OU=App, O=RSTREAM, L=City, S=State, C=ID"
          fi
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RSTREAM-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS IPA (RSTREAM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run cap:sync
      - run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - run: |
          mkdir -p ios/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/App.app ios/Payload/
          cd ios
          zip -r RSTREAM.ipa Payload
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: RSTREAM-iOS-IPA
          path: ios/RSTREAM.ipa
